{% extends "noticias/base.html" %}
{% block title %}Perfil - Local News{% endblock %}
{% load static %}

{% block content %}

<div class="max-w-lg mx-auto bg-white p-8 rounded-xl shadow-lg mt-10 text-center">

  <img src="{% static 'img/user_icon.png' %}" class="w-20 h-20 mx-auto rounded-full mb-4 border-2 border-blue-500" />

  <h2 class="text-2xl font-semibold text-gray-800 mb-2">{{ user.nome_usuario }}</h2>
  <p class="text-gray-500 mb-4">{{ user.email_usuario }}</p>
  <p class="text-sm text-gray-400 mb-6">Perfil: {{ user.perfil|title }}</p>

  <!-- Botão -->
  <button id="btnEditar" 
          class="bg-blue-600 text-white px-4 py-2 rounded-lg hover:bg-blue-700 hover:scale-[1.02] transition">
      Editar Dados
  </button>

  <!-- Formulário oculto -->
  <form id="formEdicao" 
        action="{% url 'editar_perfil' %}" 
        method="POST"
        class="mt-6 hidden text-left">
      {% csrf_token %}

      <label class="block font-semibold mb-1">Nome de Usuário</label>
      <input type="text" name="nome_usuario" value="{{ user.nome_usuario }}"
             class="w-full border border-gray-300 rounded px-3 py-2 mb-4" />

      <label class="block font-semibold mb-1">Nova Senha</label>
      <input type="password" name="senha" 
             class="w-full border border-gray-300 rounded px-3 py-2 mb-4" />

      <button class="bg-green-600 text-white px-4 py-2 rounded-lg hover:bg-green-700 transition">
        Salvar Alterações
      </button>
  </form>

</div>

<!-- Script para exibir o formulário -->
<script>
  document.getElementById("btnEditar").addEventListener("click", function () {
    document.getElementById("formEdicao").classList.toggle("hidden");
  });
</script>

{% endblock %}
