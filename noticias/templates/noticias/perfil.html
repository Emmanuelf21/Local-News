{% extends "noticias/base.html" %}
{% block title %}Perfil - Local News{% endblock %}
{% load static %}

{% block content %}

<div class="max-w-lg mx-auto bg-white p-8 rounded-2xl shadow-xl mt-14 text-center border border-amber-100">

    <!-- Foto -->
    <img src="{% static 'img/user_icon.png' %}" 
         class="w-24 h-24 mx-auto rounded-full mb-4 border-4 border-amber-500 shadow-sm" />

    <!-- Nome -->
    <h2 class="text-2xl font-bold text-gray-800 mb-1">
        {{ user.nome_usuario }}
    </h2>

    <!-- Email -->
    <p class="text-gray-500 mb-2">{{ user.email_usuario }}</p>

    <!-- Perfil -->
    <span class="text-sm bg-amber-100 text-amber-700 px-3 py-1 rounded-full mb-4 inline-block shadow-sm">
        {{ user.perfil|title }}
    </span>

    <!-- Botão -->
    <button id="btnEditar"
            class="bg-amber-600 text-white px-5 py-2.5 rounded-lg font-medium 
                   hover:bg-amber-700 transition-all hover:scale-[1.03] shadow-sm mt-2">
        Editar Dados
    </button>

    <!-- Formulário -->
    <form id="formEdicao"
          action="{% url 'editar_perfil' %}"
          method="POST"
          class="mt-6 hidden text-left animate-fade">

        {% csrf_token %}

        <label class="block font-semibold text-gray-700 mb-1">Nome de Usuário</label>
        <input type="text" name="nome_usuario" value="{{ user.nome_usuario }}"
               class="w-full border border-gray-300 rounded-lg px-3 py-2 mb-4 focus:outline-none 
                      focus:ring-2 focus:ring-amber-500 focus:border-amber-500 transition" />

        <label class="block font-semibold text-gray-700 mb-1">Nova Senha</label>
        <input type="password" name="senha"
               class="w-full border border-gray-300 rounded-lg px-3 py-2 mb-5 focus:outline-none 
                      focus:ring-2 focus:ring-amber-500 focus:border-amber-500 transition" />

        <button class="bg-green-600 text-white px-5 py-2 rounded-lg font-medium 
                       hover:bg-green-700 transition-all hover:scale-[1.03] shadow-sm">
            Salvar Alterações
        </button>
    </form>

</div>

<!-- Animação leve ao exibir -->
<style>
  .animate-fade {
    animation: fade 0.25s ease-out;
  }

  @keyframes fade {
    from { opacity: 0; transform: translateY(-6px); }
    to { opacity: 1; transform: translateY(0); }
  }
</style>

<!-- Script -->
<script>
  document.getElementById("btnEditar").addEventListener("click", function () {
    const form = document.getElementById("formEdicao");
    form.classList.toggle("hidden");
  });
</script>

{% endblock %}
