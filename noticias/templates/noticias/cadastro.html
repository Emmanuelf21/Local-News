{% extends "noticias/base.html" %}
{% block title %}Cadastro - Local News{% endblock %}

{% block content %}
<div class="max-w-md mx-auto bg-white dark:bg-gray-800 border border-warm-base/20 
            p-8 rounded-xl mt-12">

  <!-- Título -->
  <h2 id="form-title" 
      class="text-2xl font-semibold mb-6 text-center text-gray-800 dark:text-gray-100">
      Crie sua conta
  </h2>

  <!-- Formulário de Cadastro -->
  <form id="cadastro-form" method="POST" class="flex flex-col gap-5">
    {% csrf_token %}
    
    <div class="flex flex-col gap-4 text-gray-700 dark:text-gray-200">
      {{ cadastro_form.as_p }}
    </div>

    <button name="cadastro_submit" type="submit"
      class="bg-warm-base text-white py-2.5 rounded-lg font-medium
             hover:bg-warm-dark transition transform hover:scale-[1.02]">
      Cadastrar
    </button>
  </form>

  <!-- Formulário de Login -->
  <form id="login-form" method="POST" class="flex flex-col gap-5 hidden">
    {% csrf_token %}

    <div class="flex flex-col gap-4 text-gray-700 dark:text-gray-200">
      {{ login_form.as_p }}
    </div>

    <button name="login_submit" type="submit"
      class="bg-warm-base text-white py-2.5 rounded-lg font-medium
             hover:bg-warm-dark transition transform hover:scale-[1.02]">
      Entrar
    </button>
  </form>

  <!-- Link para alternar -->
  <p class="text-sm text-center text-gray-600 dark:text-gray-400 mt-5">
    Já tem conta?
    <a href="#" id="toggle-link" class="text-warm-base font-medium hover:underline">
      Entre aqui
    </a>
  </p>
</div>

<!-- Script para alternar -->
<script>
  const toggleLink = document.getElementById("toggle-link");
  const formTitle = document.getElementById("form-title");
  const loginForm = document.getElementById("login-form");
  const cadastroForm = document.getElementById("cadastro-form");

  toggleLink.addEventListener("click", (e) => {
    e.preventDefault();

    const cadastroAtivo = !cadastroForm.classList.contains("hidden");

    // Alternar
    cadastroForm.classList.toggle("hidden");
    loginForm.classList.toggle("hidden");

    // Atualizar textos
    if (cadastroAtivo) {
      formTitle.textContent = "Entre na sua conta";
      toggleLink.textContent = "Crie uma conta";
      toggleLink.previousSibling.textContent = "Não tem conta? ";
    } else {
      formTitle.textContent = "Crie sua conta";
      toggleLink.textContent = "Entre aqui";
      toggleLink.previousSibling.textContent = "Já tem conta? ";
    }
  });
</script>

{% endblock %}
