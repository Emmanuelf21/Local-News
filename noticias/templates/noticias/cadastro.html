<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block title %}Cadastro - Local News{% endblock %}</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css" rel="stylesheet">
    {% block head %}{% endblock %}
</head>
<body class="bg-gray-100 flex items-center justify-center min-h-screen">

{% block content %}
    <form method="POST" action="{% url 'cadastro' %}" 
          class="bg-white shadow-md rounded-lg p-8 w-full max-w-sm space-y-4">
        {% csrf_token %}

        <h2 class="text-2xl font-bold text-center text-gray-800 mb-4">Cadastro de Usuário</h2>

        <div>
            <label class="block text-gray-700">Email:</label>
            <input type="email" name="email" required
                   class="w-full border rounded-lg p-2 focus:outline-none focus:ring-2 focus:ring-blue-500">
        </div>

        <div>
            <label class="block text-gray-700">Nome de Usuário:</label>
            <input type="text" name="nome" required
                   class="w-full border rounded-lg p-2 focus:outline-none focus:ring-2 focus:ring-blue-500">
        </div>

        <div>
            <label class="block text-gray-700">Senha:</label>
            <input type="password" name="senha" required
                   class="w-full border rounded-lg p-2 focus:outline-none focus:ring-2 focus:ring-blue-500">
        </div>

        {% comment %} <div>
            <label class="block text-gray-700">Perfil:</label>
            <select name="perfil" 
                    class="w-full border rounded-lg p-2 focus:outline-none focus:ring-2 focus:ring-blue-500">
                <option value="usuario">Usuário Comum</option>
                <option value="editor">Editor</option>
            </select>
        </div> {% endcomment %}

        <button type="submit"
                class="w-full bg-blue-600 text-white py-2 rounded-lg hover:bg-blue-700 transition">
            <i class="fas fa-user-plus mr-2"></i> Cadastrar
        </button>
    </form>
{% endblock %}

</body>
</html>
