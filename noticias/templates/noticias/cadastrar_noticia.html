{% extends "noticias/base.html" %}
{% block title %}Nova Notícia - Local News{% endblock %}
{% block content %}

<div class="max-w-3xl mx-auto bg-white p-10 rounded-2xl shadow-[0_4px_15px_rgba(0,0,0,0.08)] mt-12">

    <h2 class="text-3xl font-bold mb-8 text-gray-800 border-b pb-3">
      Cadastrar Nova Notícia
    </h2>

    <form method="post" enctype="multipart/form-data" class="space-y-6">
        {% csrf_token %}

        <!-- Loop geral para estilizar todos os campos -->
        {% for field in form %}
            <div class="flex flex-col gap-1">
                <label class="font-semibold text-gray-700">
                    {{ field.label }}
                </label>

                {{ field }}

                {% if field.errors %}
                    <p class="text-red-600 text-sm mt-1">{{ field.errors|striptags }}</p>
                {% endif %}
            </div>
        {% endfor %}

        <button type="submit"
            class="w-full bg-blue-600 text-white cursor-pointer py-3 rounded-xl text-lg font-semibold
                   hover:bg-blue-700 hover:scale-[1.02] transition-all shadow-md">
            Publicar Notícia
        </button>
    </form>
</div>

{% endblock %}
