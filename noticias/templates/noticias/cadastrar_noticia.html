{% extends "noticias/base.html" %}
{% block title %}Nova Notícia - Local News{% endblock %}
{% block content %}
<div class="max-w-2xl mx-auto bg-white p-8 rounded-xl shadow-lg mt-10">
  <h2 class="text-2xl font-semibold mb-6 text-gray-800">Cadastrar Notícia</h2>
  <form method="post" enctype="multipart/form-data" class="flex flex-col gap-4">
    {% csrf_token %}
    {{ form.as_p }}
    <button type="submit" class="bg-blue-600 text-white py-2 rounded-lg hover:bg-blue-700 transition hover:scale-[1.02]">Publicar</button>
  </form>
</div>
{% endblock %}
